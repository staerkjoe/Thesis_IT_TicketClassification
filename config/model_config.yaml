# =============================================================================
# config/model_config.yaml
# =============================================================================

model:
  base_model_id: "unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit"
  hub_model_id: "staerkjo/checkpoints"
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: true

training:
  output_dir: "./outputs/checkpoints"
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  num_train_epochs: 1 #
  bf16: false
  fp16: true
  logging_steps: 5 #
  eval_strategy: "steps"
  eval_steps: 5 #
  save_strategy: "steps"
  save_steps: 13 #
  save_total_limit: 1 #
  push_to_hub: false #
  seed: 42
  dataloader_num_workers: 4

wandb:
  project: "thesis-it-ticket-classification"
  run_name: "Test8"
  tags:
    - "qlora"
    - "llama-3.1"
  log_prediction_samples: true
  prediction_sample_size: 25

# CSV must contain: text, label
data:
  train_file: "data/train/train.csv"
  eval_file: "data/train/eval.csv"
  labels_config: "config/config_labels.yaml"
