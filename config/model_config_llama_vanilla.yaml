# =============================================================================
# Llama 3.1 8B — vanilla (non-finetuned) baseline
#
# Run:
#   poetry run python scripts/evaluate.py \
#       --config config/model_config_llama_vanilla.yaml \
#       --dataset-type silver \
#       --data-file data/train/final_eval_data.csv \
#       --batch-size 16
# =============================================================================
model:
  base_model_id: "unsloth/meta-llama-3.1-8b-instruct-bnb-4bit"
  hub_model_id: "unsloth/meta-llama-3.1-8b-instruct-bnb-4bit"
  max_seq_length: 2048
  load_in_4bit: true
  eos_token: "<|eot_id|>"

lora:
  use_gradient_checkpointing: false

wandb:
  run_name: "llama-3.1-8b-vanilla"
  tags:
    - "vanilla"
    - "llama"
    - "baseline"
